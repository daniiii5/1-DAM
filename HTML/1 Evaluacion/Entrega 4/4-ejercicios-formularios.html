<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de Corrección de HTML - Formularios (Solo Ejercicios)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #F5F8FA;
            color: #1E2B3A;
            font-family: 'Inter', sans-serif;
        }
        .filter-btn {
            transition: all 0.3s ease;
        }
        .filter-btn.active {
            background-color: #2563EB; 
            color: #FFFFFF;
            font-weight: 600;
        }
        .code-block {
            background-color: #EBF4FF;
            border-radius: 0.5rem;
            padding: 1rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.875rem;
            color: #1F2937;
            overflow-x: auto;
            border: 1px solid #93C5FD; /* Borde para el bloque de código */
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="antialiased">

    <div class="container mx-auto px-4 py-8 md:py-12">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-blue-900">Práctica de Formularios HTML (Solo Ejercicios)</h1>
            <p class="mt-2 text-lg text-gray-600">Identifica y corrige los errores de sintaxis y semántica en los 20 fragmentos de código. **No se muestra la solución.**</p>
        </header>

        <nav id="filter-nav" class="flex flex-wrap justify-center gap-2 md:gap-4 mb-10">
            <button data-category="all" class="filter-btn active px-4 py-2 rounded-full bg-blue-100 text-blue-800 hover:bg-blue-200">Todos</button>
            <button data-category="form" class="filter-btn px-4 py-2 rounded-full bg-blue-100 text-blue-800 hover:bg-blue-200">Etiqueta &lt;form&gt;</button>
            <button data-category="input" class="filter-btn px-4 py-2 rounded-full bg-blue-100 text-blue-800 hover:bg-blue-200">Entradas &lt;input&gt;</button>
            <button data-category="label" class="filter-btn px-4 py-2 rounded-full bg-blue-100 text-blue-800 hover:bg-blue-200">Etiquetas &lt;label&gt;</button>
            <button data-category="select" class="filter-btn px-4 py-2 rounded-full bg-blue-100 text-blue-800 hover:bg-blue-200">Select y Textarea</button>
        </nav>

        <main id="exercise-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
        </main>
    </div>

    <script>
        const exercises = [
            { id: 1, category: 'form', problem: '<form method="GET" action="procesar.php"\n  <input type="text" name="usuario">\n</form>' },
            { id: 2, category: 'form', problem: '<form action="guardar.js">\n  <button type="submit">Enviar</button>\n</form/>' },
            { id: 3, category: 'input', problem: '<input type="texto" name="nombre">' },
            { id: 4, category: 'input', problem: '<input type="submit" value="Enviar Formulario"\n<input type="reset" value="Borrar">' },
            { id: 5, category: 'input', problem: '<input type="email" placeholder="tu_email@dominio.com">' },
            { id: 6, category: 'input', problem: 'Contraseña: <input name="pass" type="text">' },
            { id: 7, category: 'label', problem: '<label>\n  Correo Electrónico\n  <input type="email" name="email">\n</label for="email">' },
            { id: 8, category: 'label', problem: '<label for="nombre_input">Nombre:</label>\n<input type="text" name="nombre">' },
            { id: 9, category: 'label', problem: '<label for="check_box">Acepto términos</label>\n<input id="check_box" type="radio" name="terms">' },
            { id: 10, category: 'select', problem: '<textarea name="comentario" rows="4">/textarea>' },
            { id: 11, category: 'select', problem: '<select name="pais">\n  <option>España</option>\n  <option selected>México</option>\n</select>' },
            { id: 12, category: 'select', problem: '<select name="color">\n  <option>Rojo</option>\n  <option value="azul">Azul</option>\n</select>\n<option value="verde">Verde</option>' },
            { id: 13, category: 'input', problem: '<input type="number" min="10" max="100">' },
            { id: 14, category: 'form', problem: '<form method="DELETE" action="/borrar-usuario">\n  ...\n</form>' },
            { id: 15, category: 'input', problem: '<input type="checkbox" name="opcion" checked="true">' },
            { id: 16, category: 'label', problem: '<label>\n  <input type="text" name="dir"></label>\n<p>Dirección:</p>' },
            { id: 17, category: 'select', problem: '<select name="tamano">\n  <option value="S">Pequeño</option>\n  <option value="M">Mediano</option>\n  <option value="M">Grande</option>\n</select>' },
            { id: 18, category: 'input', problem: '<input type="radio" name="grupo" value="1">Opción 1\n<input type="radio" name="diferente" value="2">Opción 2' },
            { id: 19, category: 'select', problem: '<textarea name="mensaje" cols="80"></textarea>' },
            { id: 20, category: 'form', problem: '<form method="get" action="/buscador">\n  <input type="search" name="q" placeholder="Buscar..." autocomplete="off">\n  <button type="submit">GO</button>\n</form>' },
        ];

        const grid = document.getElementById('exercise-grid');
        const filterNav = document.getElementById('filter-nav');

        // Función auxiliar para escapar el código HTML (solo para mostrarlo como texto)
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function renderExercises(filter = 'all') {
            grid.innerHTML = '';
            const filteredExercises = filter === 'all' 
                ? exercises 
                : exercises.filter(ex => ex.category === filter);

            filteredExercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'exercise-card bg-white p-6 rounded-lg shadow-md border border-gray-200';
                card.dataset.category = ex.category;

                // Solo se muestra el problema (escapado)
                card.innerHTML = `
                    <h3 class="font-semibold text-lg mb-1 text-gray-800">Ejercicio ${ex.id}</h3>
                    <p class="text-sm text-gray-500 mb-4">Categoría: <span class="font-medium capitalize">${ex.category}</span></p>
                    <div class="code-block"><pre><code>${escapeHtml(ex.problem)}</code></pre></div>
                    `;
                grid.appendChild(card);
            });
        }

        filterNav.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') {
                const category = e.target.dataset.category;
                
                // Actualizar el estilo del botón activo
                filterNav.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                
                renderExercises(category);
            }
        });

        // Renderizar todos los ejercicios al cargar la página
        document.addEventListener('DOMContentLoaded', () => renderExercises());
    </script>
</body>
</html>
