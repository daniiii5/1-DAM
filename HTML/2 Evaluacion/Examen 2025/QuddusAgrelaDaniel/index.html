<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Gestor de Tutorías Profesional - DAM</title>
        <link rel="stylesheet" href="styles/styles.css" />
        <script src="scripts/script.js"></script>
    </head>
    <body>
        <div id="diag" class="modal-overlay">
            <div class="modal-content">
                <h3>Introduce un dato</h3>
                <input
                    type="text"
                    id="datoInput"
                    placeholder="Escribe aquí..."
                />
                <br /><br />
                <button id="cerrarModal" class="btn-blue">Guardar</button>
            </div>
        </div>

        <h1>Tutorías</h1>
        <form id="alumnoForm" action="">
            <select id="alumnosDropdown" required></select>
            <input type="datetime-local" id="fechaInput" required />
            <button id="tutoria" class="btn-blue">Programar tutoría</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Alumno</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo"></tbody>
        </table>
    </body>
</html>
