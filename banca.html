<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora 1RM - Método Bilbo</title>
    <style>
        :root {
            --primary: #00e676; /* Verde tipo "Matrix/Gym" */
            --bg: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
            --text-secondary: #b0b0b0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #333;
            background-color: #2c2c2c;
            color: var(--text);
            font-size: 1.1rem;
            box-sizing: border-box; /* Para que el padding no rompa el ancho */
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.3s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            opacity: 0.9;
        }

        #resultado-container {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #333;
            display: none; /* Oculto al inicio */
        }

        .rm-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }

        /* Tabla de porcentajes */
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        
        th {
            color: var(--text-secondary);
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Calculadora 1RM</h1>
        <p class="subtitle">Fórmula Epley / Método Bilbo</p>

        <div class="input-group">
            <label for="peso">Peso levantado (kg):</label>
            <input type="number" id="peso" placeholder="Ej: 80" step="0.5">
        </div>

        <div class="input-group">
            <label for="repeticiones">Repeticiones realizadas:</label>
            <input type="number" id="repeticiones" placeholder="Ej: 20">
        </div>

        <button onclick="calcularRM()">CALCULAR AHORA</button>

        <div id="resultado-container">
            <p style="margin:0; color:var(--text-secondary)">Tu 1RM estimado es:</p>
            <div class="rm-display" id="resultado-texto">0 kg</div>

            <table>
                <thead>
                    <tr>
                        <th>Intensidad</th>
                        <th>Peso Teórico</th>
                    </tr>
                </thead>
                <tbody id="tabla-porcentajes">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        function calcularRM() {
            // 1. Obtener valores
            const peso = parseFloat(document.getElementById('peso').value);
            const reps = parseInt(document.getElementById('repeticiones').value);

            // 2. Validación simple
            if (isNaN(peso) || isNaN(reps) || peso <= 0 || reps <= 0) {
                alert("Por favor, introduce un peso y repeticiones válidos.");
                return;
            }

            // 3. Fórmula Bilbo: (Peso * Reps * 0.0333) + Peso
            const rm1 = (peso * reps * 0.0333) + peso;

            // 4. Mostrar resultado
            const contenedor = document.getElementById('resultado-container');
            const textoResultado = document.getElementById('resultado-texto');
            
            contenedor.style.display = 'block';
            textoResultado.innerText = rm1.toFixed(2) + " kg";

            // 5. Generar tabla de porcentajes útil para entrenar
            generarTabla(rm1);
        }

        function generarTabla(rm) {
            const tbody = document.getElementById('tabla-porcentajes');
            tbody.innerHTML = ""; // Limpiar tabla anterior

            // Porcentajes típicos para entrenar
            const porcentajes = [95, 90, 85, 80, 75, 70, 60, 50];

            porcentajes.forEach(porcentaje => {
                const pesoCalculado = rm * (porcentaje / 100);
                
                const fila = `
                    <tr>
                        <td>${porcentaje}%</td>
                        <td>${pesoCalculado.toFixed(1)} kg</td>
                    </tr>
                `;
                tbody.innerHTML += fila;
            });
        }

        // Permitir calcular pulsando "Enter"
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                calcularRM();
            }
        });
    </script>

</body>
</html>
